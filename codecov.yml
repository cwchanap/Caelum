codecov:
  require_ci_to_pass: true

comment:
  layout: "condensed_files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true

ignore:
  # crates/caelum-core/** is deliberately NOT ignored: its coverage is uploaded by the
  # separate cargo-llvm-cov job (see .github/workflows/ci.yml `Run Rust tests with
  # coverage`), so gameplay-core changes count toward project/patch coverage here.
  - "src-tauri/**" # Rust host crate — no gameplay logic, covered by cargo test
  - "**/*.test.ts"
  - "**/*.spec.ts"
  - "tests/**"
  - "vite.config.ts"
  - "svelte.config.js"
  - "eslint.config.js"
