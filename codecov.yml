codecov:
  require_ci_to_pass: true

comment:
  layout: "condensed_files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true

ignore:
  # crates/caelum-core/** is deliberately NOT ignored: its coverage is uploaded by the
  # separate cargo-llvm-cov job (see .github/workflows/ci.yml `Run Rust tests with
  # coverage`), so gameplay-core changes count toward project/patch coverage here.
  - "src-tauri/**" # Rust host crate — no gameplay logic, covered by cargo test
  # caelum-wasm is a thin wasm_bindgen wrapper exercised end-to-end via the TS
  # wasmBackend tests; cargo-llvm-cov runs on the native target where the
  # #[wasm_bindgen] impls are not instrumentable, so it would otherwise read 0%.
  - "crates/caelum-wasm/**"
  - "**/*.test.ts"
  - "**/*.spec.ts"
  - "tests/**"
  - "vite.config.ts"
  - "svelte.config.js"
  - "eslint.config.js"
  # Build/entry side-effect modules: not unit-testable without contorting mocks
  # around process spawns and Svelte mounting; covered by the dev/build/e2e flow.
  - "scripts/ensure-wasm.mjs"
  # Standalone benchmark runner that boots a real WASM backend; not unit-testable
  # without mocking the wasm artifact, exercised via `benchmark:persistence:wasm`.
  - "scripts/benchmark-persistence-wasm.ts"
  - "src/main.ts"
