name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts-build-lint:
    name: TS build and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust WASM toolchain
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.0

      - name: Build WASM artifacts
        run: bun run wasm:build:release

      - name: Type check
        run: bun run check

      - name: Lint Svelte and TypeScript
        run: bun run lint:svelte

      - name: Build frontend
        run: bun run build

  ts-unit-test:
    name: TS unit test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust WASM toolchain
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.0

      - name: Build WASM artifacts
        run: bun run wasm:build:release

      - name: Run unit tests with coverage
        run: bun run test:unit:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage/lcov.info
          flags: ts-unit
          name: ts-unit
          fail_ci_if_error: true
          use_oidc: true

  playwright-test:
    name: Playwright test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust WASM toolchain
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.0

      # Playwright uses the debug-only SetBudget hook to construct expensive
      # route-repair scenarios. Release WASM intentionally ignores that intent;
      # release behavior remains covered by the build, unit, and Tauri jobs.
      - name: Build dev WASM artifacts
        run: bun run wasm:build

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright tests
        id: playwright
        continue-on-error: true
        run: bun run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail when Playwright tests fail
        if: steps.playwright.outcome == 'failure'
        run: exit 1

  rust-build-lint:
    name: Rust build and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt

      - name: Format Rust sources for diagnosis
        run: cargo +stable fmt --all

      - name: Upload rustfmt output
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-output
          path: |
            crates/caelum-core/src/network.rs
            crates/caelum-core/tests/roundabout_e2e_repro.rs
          retention-days: 1

      - name: Check Rust formatting
        run: git diff --exit-code

      - name: Run Clippy
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings

      - name: Build Rust crate
        run: cargo +stable build --workspace --all-targets --locked

  rust-unit-test:
    name: Rust unit test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run Rust tests with coverage
        run: |
          mkdir -p coverage
          cargo +stable llvm-cov --workspace --locked --lcov --output-path coverage/rust-lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage/rust-lcov.info
          flags: rust-unit
          name: rust-unit
          fail_ci_if_error: true
          use_oidc: true

  tauri-build:
    name: Tauri build (${{ matrix.os-name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ships a .app bundle; `tauri.conf.json` sets `bundle.targets`
          # to "app" (PackageType::MacOsBundle), which only builds on macOS.
          - os: macos-latest
            os-name: macOS
            bundle-target: app
          # Windows ships an NSIS installer; "app" would map to MacOsBundle
          # and fail on Windows, so override to "nsis" per platform.
          - os: windows-latest
            os-name: Windows
            bundle-target: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The Tauri artifact job bundles and uploads build outputs; do not
          # leave the GitHub token persisted in the workspace metadata.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust WASM toolchain
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.0

      - name: Build Tauri app
        # `tauri build` runs `beforeBuildCommand: bun run build`, whose
        # `prebuild` hook rebuilds the WASM artifacts, then compiles the
        # `src-tauri` crate and bundles the desktop app. This is the only CI
        # step that exercises the Tauri IPC/serde_json host path end-to-end
        # (the `src-tauri` commands are compiled and linked into the bundle),
        # de-risking serializer divergences that the WASM-only tests cannot
        # catch. The bundle target is overridden per platform because
        # `tauri.conf.json` ships "app" (a macOS-only .app bundle); on Windows
        # we build an NSIS installer instead.
        run: bun run tauri:build -- --bundles ${{ matrix.bundle-target }}
